name: Test Setup

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          EMAIL_TO_SEND: ${{ secrets.EMAIL_TO_SEND }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: |
          missing=0

          for secret in MY_EMAIL MY_PASSWORD EMAIL_TO_SEND OWM_API_KEY; do
            if [ -z "${!secret}" ]; then
              echo "::error::$secret secret is not configured"
              missing=1
            else
              echo "$secret is configured"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Configure missing secrets in Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo "All required secrets are configured!"

      - name: Check required files
        run: |
          for file in main.py requirements.txt; do
            if [ -f "$file" ]; then
              echo "$file found"
            else
              echo "::error::Required file $file not found"
              exit 1
            fi
          done

          echo "All required files found!"

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          echo "Python syntax OK"

      - name: Verify dependencies
        run: |
          python -m pip check
          echo "Dependencies OK"

      - name: Success
        run: |
          echo "========================================"
          echo "  All setup checks passed!"
          echo "  Python: $(python --version)"
          echo "  Your setup is ready."
          echo "========================================"